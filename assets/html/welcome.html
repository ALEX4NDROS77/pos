<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #6200ea;
            color: white;
            padding: 20px 0;
        }
        h1 {
            margin: 0;
        }
        p {
            font-size: 1.2em;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>MVTE - Inicio de sesión de barra</h1>
    </header>
    <h2>Usuario</h2>
    
    <form id="loginForm" method="POST" action="/login">
        <select id="userType" class="standard-arrow" name="userType">
            <option value="vendedor">Vendedor</option>
            <option value="admin">Admin</option>
        </select>
        
        <div id="passwordField" class="hidden">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password">
        </div>
        
        <button type="submit">Login</button>
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        const userType = document.getElementById('userType');
        const passwordField = document.getElementById('passwordField');
        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');

        // Show/hide password field based on user type
        userType.addEventListener('change', function() {
            if (this.value === 'admin') {
                passwordField.classList.remove('hidden');
            } else {
                passwordField.classList.add('hidden');
            }
        });

        // Hash the password before submitting the form
        loginForm.addEventListener('submit', function(event) {
            if (userType.value === 'admin') {
                event.preventDefault(); // Prevent the default form submission

                // Hash the password using SHA-256
                const hashedPassword = CryptoJS.SHA256(passwordInput.value).toString();

                // Create a hidden input field to send the hashed password
                const hashedPasswordInput = document.createElement('input');
                hashedPasswordInput.type = 'hidden';
                hashedPasswordInput.name = 'hashedPassword';
                hashedPasswordInput.value = hashedPassword;

                // Append the hashed password input to the form
                loginForm.appendChild(hashedPasswordInput);

                // Clear the plain text password field
                passwordInput.value = '';

                // Submit the form
                loginForm.submit();
            }
        });
    </script>
</body>
</html>
