<style>
	.product-grid {
		display: grid;
		grid-template-columns: repeat(3, 1fr);
		gap: 15px;
		margin-bottom: 30px;
	}
	.product-card {
		background: linear-gradient(135deg, #222 0%, #111 100%);
		border: 2px solid #333;
		border-radius: 8px;
		padding: 8px;
		text-align: center;
		cursor: pointer;
		transition: all 0.2s;
	}
	.product-card:hover, .product-card.selected {
		border-color: var(--primary-red);
		box-shadow: 0 0 10px rgba(212,20,20,0.4);
		transform: scale(1.02);
	}
	.product-card.out-of-stock {
		opacity: 0.4;
		pointer-events: none;
	}
	.product-img {
		width: 65px;
		height: 65px;
		background: linear-gradient(135deg, #444 0%, #222 100%);
		border-radius: 6px;
		margin: 0 auto 3px;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 1.5rem;
		color: #666;
		object-fit: cover;
	}
	.product-name {
		font-weight: bold;
		color: white;
		font-size: 0.7rem;
		margin-bottom: 1px;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
		line-height: 1.2;
	}
	.product-price {
		color: var(--accent-orange);
		font-weight: bold;
		font-size: 0.75rem;
		line-height: 1.2;
	}
	.product-stock {
		color: #888;
		font-size: 0.6rem;
		line-height: 1.2;
	}
	.qty-controls {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 8px;
		margin: 8px 0;
	}
	.qty-btn {
		width: 40px;
		height: 40px;
		font-size: 1.3rem;
		background: var(--primary-red);
		border: none;
		border-radius: 6px;
		color: white;
		cursor: pointer;
	}
	.qty-display {
		font-size: 1.5rem;
		font-weight: bold;
		color: white;
		min-width: 40px;
		text-align: center;
	}
	.selected-product {
		background: rgba(212,20,20,0.2);
		border: 2px solid var(--primary-red);
		border-radius: 8px;
		padding: 10px;
		margin-bottom: 10px;
		text-align: center;
	}
	.selected-product h3 {
		font-size: 1rem;
		margin 0 0 5px 0;
	}
	.cart-table-wrapper {
		overflow-x: auto;
		-webkit-overflow-scrolling:touch;
	}
	.cart-table {
		width: 100%;
		font-size: 0.8rem;
		min-width: 400px;
	}
	.cart-table th, .cart-table td {
		padding: 6px 4px;
		white-space: nowrap;
	}
	.cart-table .btn { padding: 4px 8px; font-size: 0.7rem; }
	@media (min-width: 600px) {
		.product-grid { grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 12px; }
		.product-card { padding: 10px; }
		.product-img { width: 70px; hehight: 70px; }
		.product-name { font-size: 0.85rem; }
	}
</style>
<div class='container'>
<div class='header'><h1>Carrito de Compras</h1>
<a href='/home' class='btn btn-primary'>Volver al Menu</a></div>
{{MESSAGE_BLOCK}}
<h3>Seleccionar Producto</h3>
<div class='product-grid'>
{{PRODUCT_CARDS}}
</div>
<div class="selected-product" id="selected_area" style="display:none;">
	<h3 id="selected_name">-</h3>
	<div class="qty-controls">
		<button type="button" class="qty-btn" onclick='change_qty(-1)'>-</button>
		<span class="qty-display" id="qty_display">1</span>
		<button type="button" class="qty-btn" onclick='change_qty(1)'>+</button>
	</div>
	<form method="POST" action="/cart/add" id="add_form">
		<input type="hidden" name="product_id" id="selected_product_id">
		<input type="hidden" name="quantity" id="selected_qty" value="1">
		<button type="submit" class="btn btn-success" style="padding: 6px 16px; font-size: 0.85rem;">Agregar</button>
	</form>
</div>
<script>
const stocks = {{STOCKS_JSON}};
const prices = {{PRICES_JSON}};
const names = {{NAMES_JSON}};
	let selected_id = null;
	let qty = 1;

	function select_product(id) {
		if(stocks[id] <= 0) return;
		document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
		selected_id = id;
		qty = 1;
		document.getElementById('card-' + id).classList.add('selected');
		document.getElementById('selected_area').style.display = 'block';
		document.getElementById('selected_name').textContent = names[id] + ' - {{CURRENCY_SYMBOL}}' + prices[id];
		document.getElementById('selected_product_id').value = id;
		update_qty();
	}

	function change_qty(delta) {
		if(!selected_id) return;
		qty = Math.max(1, Math.min(stocks[selected_id], qty + delta));
		update_qty();
	}

	function update_qty() {
		document.getElementById('qty_display').textContent = qty;
		document.getElementById('selected_qty').value = qty;
	}
</script>
<h3 style='margin-top: 15px;'>Carrito Actual</h3>
{{CART_SECTION}}
</div>
