<style>
	.isle-card { background: #1a1a1a; border: 2px solid #333; border-radius: 8px; padding: 15px; box-sizing: border-box; scroll-snap-align: start; flex: 0 0 100%; }
	.isle-sales { display: flex; gap: 20px; margin: 10px 0 15px; flex-wrap: wrap; }
	.isle-sales-item { font-size: 0.95rem; }
	.stock-ok { color: var(--text-main); }
	.stock-warning { color: var(--accent-orange); font-weight: bold; }
	.stock-critical { color: var(--primary-red); font-weight: bold; }
	.isle-slider-wrap { position: relative; }
	.isle-slider {
		display: flex;
		gap: 15px;
		overflow-x: auto;
		scroll-snap-type: x mandatory;
		scroll-behavior: smooth;
		-webkit-overflow-scrolling: touch;
		padding-bottom: 10px;
	}
	.slider-btn {
		position: absolute;
		top: 50%;
		transform: translateY(-50%);
		background: var(--primary-red);
		color: white;
		border: none;
		border-radius: 50%;
		width: 40px;
		height: 40px;
		font-size: 1.3rem;
		line-height: 1;
		cursor: pointer;
		z-index: 2;
		opacity: 0.85;
	}
	.slider-prev { left: -5px; }
	.slider-next { right: -5px; }
	@media (max-width: 700px) {
		.slider-btn { display: none; }
	}
</style>
<div class='container'>
<div class='header'><h1>Monitoreo en Vivo</h1>
<a href='/home' class='btn btn-primary'>Volver al Menu</a></div>
<div class='isle-slider-wrap'>
<button type="button" class="slider-btn slider-prev" onclick="slide(-1)">&#8249;</button>
<div id='monitoring-body' class='isle-slider'>{{MONITORING_BODY}}</div>
<button type="button" class="slider-btn slider-next" onclick="slide(1)">&#8250;</button>
</div>
</div>
<script>
function slide(direction) {
	const container = document.getElementById('monitoring-body');
	container.scrollBy({ left: direction * container.clientWidth, behavior: 'smooth' });
}

setInterval(function() {
	const container = document.getElementById('monitoring-body');
	const scroll_pos = container.scrollLeft;
	fetch('/monitoring/data').then(function(r) { return r.text(); }).then(function(html) {
		container.innerHTML = html;
		container.scrollLeft = scroll_pos;
	});
}, 5000);
</script>
